<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>五子棋 · 单机对战</title>
<style>
  :root{
    --bg:#f5f2ec;
    --card:#ffffff;
    --line:#e6e0d6;
    --ink:#2f2a24;
    --sub:#8a8175;
    --accent:#8b5e34;
    --accent-soft:#f3e7d8;
    --shadow:0 8px 28px rgba(80,60,40,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:960px}
  header{text-align:center;margin-bottom:20px}
  header h1{font-size:26px;letter-spacing:6px;font-weight:600}
  header p{color:var(--sub);font-size:13px;margin-top:6px;letter-spacing:1px}

  .layout{display:flex;gap:22px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

  .board-card{
    position:relative;background:var(--card);border-radius:18px;padding:14px;
    box-shadow:var(--shadow);
  }
  canvas{display:block;border-radius:10px;touch-action:manipulation;cursor:pointer;max-width:100%;height:auto}

  .overlay{
    position:absolute;inset:14px;border-radius:10px;
    background:rgba(255,255,255,.86);backdrop-filter:blur(3px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    animation:fade .25s ease;
  }
  .overlay.show{display:flex}
  .overlay .result{font-size:28px;font-weight:600;letter-spacing:2px}
  .overlay .result small{display:block;font-size:13px;color:var(--sub);font-weight:400;margin-top:8px;letter-spacing:1px}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .panel{width:260px;background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .group{margin-bottom:18px}
  .group:last-child{margin-bottom:0}
  .label{font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:8px}

  .seg{display:flex;background:#f3efe8;border-radius:10px;padding:3px;gap:3px}
  .seg button{
    flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;
    font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit;transition:.18s;
  }
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.07)}
  .seg.three button{font-size:12px}

  .turn{
    display:flex;align-items:center;gap:10px;padding:12px;background:#faf7f2;border-radius:12px;
  }
  .dot{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid #ddd}
  .dot.b{background:radial-gradient(circle at 34% 32%,#5a5a5a,#0a0a0a)}
  .dot.w{background:radial-gradient(circle at 34% 32%,#fff,#cfc9c0)}
  .turn .txt{font-size:14px}
  .turn .txt span{color:var(--sub);font-size:12px;display:block;margin-top:2px}

  .score{display:flex;align-items:center;justify-content:space-around;padding:12px 0}
  .score .col{text-align:center}
  .score .num{font-size:24px;font-weight:600;line-height:1}
  .score .cap{font-size:12px;color:var(--sub);margin-top:6px}
  .score .vs{color:#ddd;font-size:18px}

  .btns{display:flex;gap:10px}
  .btn{
    flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:10px 0;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;transition:.18s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#75502c;color:#fff}

  .tip{font-size:12px;color:var(--sub);line-height:1.7;background:#faf7f2;border-radius:10px;padding:10px 12px}

  @media(max-width:760px){
    .layout{flex-direction:column;align-items:center}
    .panel{width:100%;max-width:568px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>五 子 棋</h1>
    <p>黑白对弈 · 先连五者胜</p>
  </header>

  <div class="layout">
    <div class="board-card">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <div class="result" id="resultText">黑棋胜利</div>
        <button class="btn primary" id="againBtn" style="padding:10px 28px;flex:none">再来一局</button>
      </div>
    </div>

    <aside class="panel">
      <div class="group">
        <div class="label">对战模式</div>
        <div class="seg" id="modeSeg">
          <button data-v="pvp" class="on">双人对战</button>
          <button data-v="pve">人机对战</button>
        </div>
      </div>

      <div class="group" id="levelGroup">
        <div class="label">电脑棋力</div>
        <div class="seg three" id="levelSeg">
          <button data-v="easy">简单</button>
          <button data-v="normal" class="on">普通</button>
          <button data-v="hard">困难</button>
        </div>
      </div>

      <div class="group" id="sideGroup">
        <div class="label">我执</div>
        <div class="seg" id="sideSeg">
          <button data-v="1" class="on">黑棋（先手）</button>
          <button data-v="2">白棋（后手）</button>
        </div>
      </div>

      <div class="group">
        <div class="label">当前棋局</div>
        <div class="turn">
          <div class="dot b" id="turnDot"></div>
          <div class="txt" id="turnTxt">黑棋落子<span>第 1 手</span></div>
        </div>
      </div>

      <div class="group">
        <div class="score">
          <div class="col"><div class="num" id="blackScore">0</div><div class="cap">黑胜</div></div>
          <div class="vs">:</div>
          <div class="col"><div class="num" id="whiteScore">0</div><div class="cap">白胜</div></div>
        </div>
      </div>

      <div class="group btns">
        <button class="btn" id="undoBtn">悔棋</button>
        <button class="btn" id="resetBtn">重新开始</button>
      </div>

      <div class="group">
        <div class="tip" id="tip">黑棋先行，点击交叉点落子。</div>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 常量 ---------- */
  const N = 15, EMPTY = 0, BLACK = 1, WHITE = 2;
  const PAD = 32, CELL = 36, R = CELL * 0.44;
  const SPAN = PAD * 2 + CELL * (N - 1);   // 568
  const DIRS = [[1,0],[0,1],[1,1],[1,-1]];

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = SPAN * dpr; canvas.height = SPAN * dpr;
  canvas.style.width = SPAN + 'px'; canvas.style.height = SPAN + 'px';
  ctx.scale(dpr, dpr);

  /* ---------- 状态 ---------- */
  const S = {
    mode: 'pvp',        // pvp | pve
    level: 'normal',    // easy | normal | hard
    human: BLACK,       // 人机模式下玩家执子
    board: [],
    history: [],
    turn: BLACK,
    over: false,
    thinking: false,
    winLine: null,
    last: null,
    hover: null,
    score: { 1: 0, 2: 0 }
  };

  const idx = (i, j) => i * N + j;
  const inside = (i, j) => i >= 0 && i < N && j >= 0 && j < N;

  function newBoard(){
    return Array.from({ length: N }, () => new Array(N).fill(EMPTY));
  }

  function reset(keepScore){
    S.board = newBoard();
    S.history = [];
    S.turn = BLACK;
    S.over = false;
    S.thinking = false;
    S.winLine = null;
    S.last = null;
    S.hover = null;
    if (!keepScore) { S.score = { 1: 0, 2: 0 }; }
    document.getElementById('overlay').classList.remove('show');
    if (S.mode === 'pve' && S.human === WHITE) {
      // 电脑执黑先行
      setTimeout(() => aiMove(), 400);
    }
    syncUI();
    draw();
  }

  /* ---------- 落子与胜负 ---------- */
  function place(i, j, color){
    S.board[i][j] = color;
    S.history.push({ i, j, color });
    S.last = { i, j };
    beep();
    const win = checkWin(i, j, color);
    if (win) {
      S.over = true;
      S.winLine = win;
      S.score[color]++;
      showResult(color);
    } else if (S.history.length === N * N) {
      S.over = true;
      showResult(0);
    } else {
      S.turn = 3 - color;
    }
    draw();
  }

  function checkWin(i, j, color){
    for (const [dx, dy] of DIRS) {
      let line = [[i, j]];
      for (const s of [1, -1]) {
        let x = i + dx * s, y = j + dy * s;
        while (inside(x, y) && S.board[x][y] === color) {
          line.push([x, y]);
          x += dx * s; y += dy * s;
        }
      }
      if (line.length >= 5) {
        line.sort((a, b) => (a[0] - b[0]) || (a[1] - b[1]));
        return [line[0], line[line.length - 1]];
      }
    }
    return null;
  }

  /* ---------- 玩家交互 ---------- */
  canvas.addEventListener('mousemove', e => {
    const p = toGrid(e);
    const changed = (!p && S.hover) || (p && (!S.hover || S.hover[0] !== p[0] || S.hover[1] !== p[1]));
    if (changed) { S.hover = p; draw(); }
  });
  canvas.addEventListener('mouseleave', () => { S.hover = null; draw(); });

  canvas.addEventListener('click', e => {
    if (S.over || S.thinking) return;
    if (S.mode === 'pve' && S.turn !== S.human) return;
    const p = toGrid(e);
    if (!p) return;
    const [i, j] = p;
    if (S.board[i][j] !== EMPTY) return;
    place(i, j, S.turn);
    if (!S.over && S.mode === 'pve') {
      S.thinking = true;
      syncUI(); draw();
      setTimeout(() => { aiMove(); S.thinking = false; syncUI(); draw(); }, 320);
    }
  });

  function toGrid(e){
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (SPAN / r.width);
    const y = (e.clientY - r.top) * (SPAN / r.height);
    const j = Math.round((x - PAD) / CELL);
    const i = Math.round((y - PAD) / CELL);
    if (!inside(i, j)) return null;
    const dx = x - (PAD + j * CELL), dy = y - (PAD + i * CELL);
    if (Math.hypot(dx, dy) > CELL * 0.48) return null;
    return [i, j];
  }

  /* ---------- 电脑 AI ---------- */
  // 以 (i,j) 为中心、沿 (dx,dy) 方向，假定已落 color 后形成的棋型
  function scan(i, j, dx, dy, color, allowGap){
    let len = 1, blocked = 0, usedGap = false;
    for (const s of [1, -1]) {
      let x = i + dx * s, y = j + dy * s;
      for (;;) {
        if (!inside(x, y)) { blocked++; break; }
        const v = S.board[x][y];
        if (v === color) { len++; x += dx * s; y += dy * s; continue; }
        if (v === EMPTY) {
          if (allowGap && !usedGap) {
            const nx = x + dx * s, ny = y + dy * s;
            if (inside(nx, ny) && S.board[nx][ny] === color) {
              usedGap = true; len++; x = nx; y = ny; continue;
            }
          }
          break; // 空位：该端开放
        }
        blocked++; break; // 对方子
      }
    }
    return { len, blocked };
  }

  function shapeScore(len, blocked){
    if (len >= 5) return 1000000;
    if (len === 4) return blocked === 0 ? 100000 : (blocked === 1 ? 12000 : 0);
    if (len === 3) return blocked === 0 ? 9000 : (blocked === 1 ? 1200 : 0);
    if (len === 2) return blocked === 0 ? 900 : (blocked === 1 ? 120 : 0);
    return blocked === 0 ? 90 : (blocked === 1 ? 12 : 0);
  }

  function evalPoint(i, j, color){
    let total = 0;
    for (const [dx, dy] of DIRS) {
      const a = scan(i, j, dx, dy, color, false);
      const b = scan(i, j, dx, dy, color, true);
      total += Math.max(shapeScore(a.len, a.blocked), shapeScore(b.len, b.blocked) * 0.9);
    }
    return total;
  }

  function candidates(){
    const has = S.history.length > 0;
    if (!has) return [[7, 7]];
    const set = new Set(), out = [];
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      if (S.board[i][j] !== EMPTY) continue;
      let near = false;
      for (let a = -2; a <= 2 && !near; a++)
        for (let b = -2; b <= 2; b++)
          if (inside(i + a, j + b) && S.board[i + a][j + b] !== EMPTY) { near = true; break; }
      if (near) out.push([i, j]);
    }
    return out.length ? out : [[7, 7]];
  }

  function aiMove(){
    if (S.over) return;
    const me = 3 - S.human, foe = S.human;
    const lv = S.level;
    const weight = lv === 'easy' ? 0.55 : (lv === 'hard' ? 1.05 : 0.9);
    const noise = lv === 'easy' ? 260 : (lv === 'hard' ? 0 : 40);

    const list = candidates();
    const scored = [];
    for (const [i, j] of list) {
      // 中心偏好
      const center = 12 - (Math.abs(i - 7) + Math.abs(j - 7));
      S.board[i][j] = me;
      const atk = evalPoint(i, j, me);
      S.board[i][j] = foe;
      const def = evalPoint(i, j, foe);
      S.board[i][j] = EMPTY;

      let v = atk + def * weight + center + Math.random() * noise;
      // 绝杀 / 必堵
      if (atk >= 1000000) v = 1e9;
      if (def >= 1000000) v = Math.max(v, 9e8);
      if (lv === 'hard' && def >= 100000) v = Math.max(v, 5e8);   // 必堵活四
      if (lv === 'hard' && atk >= 100000) v = 1e9;                // 自己成四
      scored.push({ i, j, v });
    }
    scored.sort((a, b) => b.v - a.v);

    let pick = scored[0];
    if (lv === 'easy' && scored.length > 2 && Math.random() < 0.3) pick = scored[1];
    place(pick.i, pick.j, me);
  }

  /* ---------- 绘制 ---------- */
  function draw(){
    // 棋盘底
    const g = ctx.createLinearGradient(0, 0, SPAN, SPAN);
    g.addColorStop(0, '#f7dfae'); g.addColorStop(.5, '#edcb92'); g.addColorStop(1, '#e3bd7c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SPAN, SPAN);

    // 网格
    ctx.strokeStyle = 'rgba(90,58,25,.65)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 0; k < N; k++) {
      const p = PAD + k * CELL;
      ctx.moveTo(PAD, p); ctx.lineTo(PAD + CELL * (N - 1), p);
      ctx.moveTo(p, PAD); ctx.lineTo(p, PAD + CELL * (N - 1));
    }
    ctx.stroke();

    // 外框
    ctx.strokeStyle = 'rgba(90,58,25,.85)';
    ctx.lineWidth = 2;
    ctx.strokeRect(PAD, PAD, CELL * (N - 1), CELL * (N - 1));

    // 星位
    ctx.fillStyle = 'rgba(70,45,18,.85)';
    for (const [i, j] of [[3,3],[3,11],[11,3],[11,11],[7,7]]) {
      ctx.beginPath();
      ctx.arc(PAD + j * CELL, PAD + i * CELL, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 落子预览
    if (S.hover && !S.over && !S.thinking && S.board[S.hover[0]][S.hover[1]] === EMPTY) {
      const [hi, hj] = S.hover;
      const ok = !(S.mode === 'pve' && S.turn !== S.human);
      ctx.globalAlpha = ok ? 0.4 : 0.15;
      drawStone(hj, hi, S.turn);
      ctx.globalAlpha = 1;
    }

    // 棋子
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      if (S.board[i][j] !== EMPTY) drawStone(j, i, S.board[i][j]);
    }

    // 最后一手标记
    if (S.last) {
      const { i, j } = S.last;
      ctx.strokeStyle = S.board[i][j] === BLACK ? '#fff' : '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(PAD + j * CELL, PAD + i * CELL, R * 0.42, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 胜利连线
    if (S.winLine) {
      const [[i1, j1], [i2, j2]] = S.winLine;
      ctx.strokeStyle = 'rgba(214,48,49,.9)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(PAD + j1 * CELL, PAD + i1 * CELL);
      ctx.lineTo(PAD + j2 * CELL, PAD + i2 * CELL);
      ctx.stroke();
    }
  }

  function drawStone(px, py, color){
    const x = PAD + px * CELL, y = PAD + py * CELL;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.shadowColor = 'rgba(0,0,0,.28)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 2;
    const g = ctx.createRadialGradient(x - R * .32, y - R * .34, R * .12, x, y, R);
    if (color === BLACK) { g.addColorStop(0, '#6b6b6b'); g.addColorStop(.55, '#222'); g.addColorStop(1, '#000'); }
    else { g.addColorStop(0, '#fff'); g.addColorStop(.6, '#f4f1ec'); g.addColorStop(1, '#c9c3b9'); }
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  /* ---------- 界面同步 ---------- */
  function showResult(color){
    const el = document.getElementById('resultText');
    if (color === 0) {
      el.innerHTML = '和 棋<small>棋盘已满，势均力敌</small>';
    } else {
      const who = color === BLACK ? '黑 棋 胜 利' : '白 棋 胜 利';
      const extra = S.mode === 'pve'
        ? (color === S.human ? '恭喜，你赢了' : '电脑赢了，再来一局')
        : '五子连珠';
      el.innerHTML = who + '<small>' + extra + '</small>';
    }
    document.getElementById('overlay').classList.add('show');
  }

  function syncUI(){
    document.getElementById('turnDot').className = 'dot ' + (S.turn === BLACK ? 'b' : 'w');
    const n = S.history.length + 1;
    let main = S.turn === BLACK ? '黑棋落子' : '白棋落子';
    let sub = '第 ' + n + ' 手';
    if (S.thinking) { main = '电脑思考中'; sub = '请稍候…'; }
    if (S.over) { main = '本局结束'; sub = '共 ' + S.history.length + ' 手'; }
    else if (S.mode === 'pve') sub += S.turn === S.human ? ' · 你的回合' : ' · 电脑回合';
    document.getElementById('turnTxt').innerHTML = main + '<span>' + sub + '</span>';
    document.getElementById('blackScore').textContent = S.score[1];
    document.getElementById('whiteScore').textContent = S.score[2];
    document.getElementById('undoBtn').disabled = S.history.length === 0 || S.thinking;
    document.getElementById('levelGroup').style.display = S.mode === 'pve' ? '' : 'none';
    document.getElementById('sideGroup').style.display = S.mode === 'pve' ? '' : 'none';
    document.getElementById('tip').textContent = S.mode === 'pvp'
      ? '两位玩家轮流落子，黑棋先行。'
      : '你执' + (S.human === BLACK ? '黑' : '白') + '棋，电脑执' + (S.human === BLACK ? '白' : '黑') + '棋。';
  }

  /* ---------- 音效 ---------- */
  let actx = null;
  function beep(){
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), gn = actx.createGain();
      o.type = 'triangle';
      o.frequency.value = 260 + Math.random() * 60;
      gn.gain.setValueAtTime(0.12, actx.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime + 0.13);
      o.connect(gn).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.13);
    } catch (e) {}
  }

  /* ---------- 控件绑定 ---------- */
  function seg(id, cb){
    document.getElementById(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      [...b.parentNode.children].forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      cb(b.dataset.v);
    });
  }

  seg('modeSeg', v => { S.mode = v; reset(false); });
  seg('levelSeg', v => { S.level = v; });
  seg('sideSeg', v => { S.human = +v; reset(false); });

  document.getElementById('resetBtn').addEventListener('click', () => reset(true));
  document.getElementById('againBtn').addEventListener('click', () => reset(true));
  document.getElementById('undoBtn').addEventListener('click', () => {
    if (!S.history.length || S.thinking) return;
    const steps = (S.mode === 'pve' && S.history.length >= 2) ? 2 : 1;
    for (let k = 0; k < steps; k++) {
      const m = S.history.pop();
      if (m) S.board[m.i][m.j] = EMPTY;
    }
    S.over = false;
    S.winLine = null;
    S.turn = S.history.length ? 3 - S.history[S.history.length - 1].color : BLACK;
    S.last = S.history.length ? S.history[S.history.length - 1] : null;
    document.getElementById('overlay').classList.remove('show');
    syncUI(); draw();
  });

  window.addEventListener('resize', draw);

  reset(false);
})();
</script>
</body>
</html>
